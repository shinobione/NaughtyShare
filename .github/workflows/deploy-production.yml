name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'bootstrap = locked first deploy; production = real Access secrets'
        required: true
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - production
      confirm:
        description: 'Type DEPLOY to authorize the release'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: naughtyshare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'DEPLOY' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production preflight
        run: npm run preflight:production

      - name: Build
        run: npm run build

      - name: Prepare bootstrap lock secrets
        if: ${{ github.event.inputs.mode == 'bootstrap' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' \
            'ACCESS_TEAM_DOMAIN=bootstrap.invalid' \
            'ACCESS_AUD=bootstrap-locked' \
            'ALLOWED_EMAILS=nobody@example.invalid' > .env.production

      - name: Prepare real Access secrets
        if: ${{ github.event.inputs.mode == 'production' }}
        shell: bash
        env:
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
        run: |
          set -euo pipefail
          umask 077
          for name in ACCESS_TEAM_DOMAIN ACCESS_AUD ALLOWED_EMAILS; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub production secret: $name" >&2
              exit 1
            fi
          done
          printf 'ACCESS_TEAM_DOMAIN=%s\nACCESS_AUD=%s\nALLOWED_EMAILS=%s\n' \
            "$ACCESS_TEAM_DOMAIN" "$ACCESS_AUD" "$ALLOWED_EMAILS" > .env.production

      - name: Deploy Worker and secrets atomically
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler deploy --strict --secrets-file .env.production

      - name: Remove temporary secrets file
        if: ${{ always() }}
        shell: bash
        run: rm -f .env.production
